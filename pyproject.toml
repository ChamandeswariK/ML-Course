[project]
name = "ML-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chamandeswari Kaza", email = "Chamandeswari.Kaza@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "bs4>=0.0.2",
    "fastapi>=0.162.0",
    "fg-data-profiling>=4.20.0",
    "ipykernel>=7.4.0",
    "lxml>=6.1.3",
    "matplotlib>=3.9.0,<3.11.0",
    "mlxtend>=0.25.0",
    "mysql-connector>=2.2.9",
    "numpy>=2.1.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "scikit-learn>=1.6.0",
    "seaborn>=0.12.2,<0.13.0",
    "sweetviz>=2.3.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
ML-course = "ML_course:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
